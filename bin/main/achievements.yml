# BakaAchievements 自定义成就配置文件
# 成就节点格式：分类.子分类.成就名（最多5层嵌套）
# type: CATEGORY（分类） 或 ACHIEVEMENT（成就）
# auto: true 表示条件全部满足后自动完成

customAchievements:
  # ============================================
  # 战斗与防御
  # ============================================
  battle_defense:
    type: "CATEGORY"
    name: "battle_defense"
    display: "<yellow><b>战斗与防御</b></yellow>"
    descriptions:
      - "在战场上证明你的实力"
    material: "IRON_SWORD"
    permission: false
    son:
      # ===== 造成伤害 =====
      damage_20:
        type: "ACHIEVEMENT"
        name: "damage_20"
        display: "<aqua>初经战阵</aqua>"
        descriptions:
          - "累积造成 20 点伤害"
        material: "WOODEN_SWORD"
        permission: false
        auto: true
        conditions:
          a:
            type: ">="
            display: "累积造成 <white>{target}</white> 点伤害"
            target: "20"
            current: "%statistic_damage_dealt%"

      damage_120:
        type: "ACHIEVEMENT"
