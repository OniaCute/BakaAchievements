# BakaAchievements language file, MiniMessage format

PREFIX: "<#6cd3ff>成就 <dark_gray>»</dark_gray>"
NO_PERMISSION: "{prefix} <red>你没有权限执行此操作.</red>"
PLAYER_ONLY: "{prefix} <red>这个命令只能由玩家使用.</red>"
PLAYER_NOT_FOUND: "{prefix} <red>没有找到这个玩家, 或玩家从未进入过服务器.</red>"
CONFIG_RELOADED: "{prefix} <green>配置文件已重新载入.</green>"
MESSAGES_RELOADED: "{prefix} <green>语言文件已重新载入.</green>"
ACHIEVEMENTS_RELOADED: "{prefix} <green>成就树已重新载入.</green> <gray>共 <white>{count}</white> 项.</gray>"
