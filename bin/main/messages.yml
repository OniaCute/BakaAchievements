DISABLE_SUCCESS: "{prefix} <yellow>已禁用成就节点 <white>{node}</white>.</yellow>"
NODE_NOT_FOUND: "{prefix} <red>未找到成就节点: <white>{node}</white></red>"
INVALID_USAGE: "{prefix} <red>命令格式: <white>{usage}</white></red>"
USAGE_SEARCH: "/bac search <keyword>"
USAGE_CHECK: "/bac check <player>"
USAGE_SET: "/bac set <player> <node> <true/false>"
USAGE_ENABLE: "/bac enable <node>"
USAGE_DISABLE: "/bac disable <node>"
TIPS_ENABLED: "{prefix} <green>成就提示已开启.</green>"
TIPS_DISABLED: "{prefix} <yellow>成就提示已关闭.</yellow>"
TIPS_ENABLED_SELF: "{prefix} <green>自己的成就提示已开启.</green>"
TIPS_DISABLED_SELF: "{prefix} <yellow>自己的成就提示已关闭.</yellow>"
TIPS_ENABLED_OTHERS: "{prefix} <green>他人成就提示已开启.</green>"
TIPS_DISABLED_OTHERS: "{prefix} <yellow>他人成就提示已关闭.</yellow>"
TIPS_ENABLED_ALL: "{prefix} <green>全部成就提示已开启.</green>"
TIPS_DISABLED_ALL: "{prefix} <yellow>全部成就提示已关闭.</yellow>"

