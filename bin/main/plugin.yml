name: BakaAchievements
version: '${version}'
main: cc.oniacute.plugin.bakaachievements.BakaAchievements
api-version: '1.21'
prefix: BakaAchievements
authors: [ OniaCute ]
description: A custom achievements plugin with chest GUI, vanilla sync, and PlaceholderAPI support.
website: www.oniacute.cc

depend: []
softdepend: [ PlaceholderAPI, HeadDatabase ]

commands:
  bakaachievements:
    description: BakaAchievements main command
    usage: /bakaachievements [search|check|set|enable|disable|reload|tips|info|reload achievement]
    aliases: [ bac, bakaachieve, bachieve ]

permissions:
  bakaachievements.admin:
    description: Allows administrative actions for BakaAchievements
    default: op
    children:
      bakaachievements.player: true
  bakaachievements.player:
    description: Allows opening achievement GUI and checking status
    default: true
  bakaachievements.share:
    description: Allows sharing achievements with Shift+Left click
    default: true
  bakaachievements.share.cooldown:
    description: Bypass share cooldown checks
    default: op
  bakaachievements.category.*:
    description: Wildcard for category access permissions
    default: false
  bakaachievements.achievement.*:
    description: Wildcard for achievement access permissions
    default: false
