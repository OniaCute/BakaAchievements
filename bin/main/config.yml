# BakaAchievements 主配置文件

debug: false

async:
  scan-interval-ticks: 60   # 成就条件扫描间隔（tick，20tick=1秒）
  thread-pool-size: 2        # 异步线程池大小

storage:
  flush-interval-ticks: 600  # 脏数据写盘间隔（tick）
  cache-evict-after-offline-minutes: 5  # 玩家离线多少分钟后淘汰缓存

chat:
  override-vanilla: true     # 是否替换原版成就解锁广播消息
  format: "<gold>{player_displayname}</gold> <gray>解锁了成就</gray> <green>{display}</green>"

share:
  enabled: true
  cooldown-seconds: 10
  global-cooldown-seconds: 5
  allow-locked: true         # 是否允许分享未解锁成就

gui:
  rows: 6
  fill-empty: true
  refresh-interval-ticks: 600
  vanilla-category-first: true  # 原版成就分类是否排在第一位
  click-sound: BLOCK_LEVER_CLICK  # 点击 GUI 物品时的音效（设为 NONE 禁用）
  border-material: GRAY_STAINED_GLASS_PANE  # 周圈玻璃板材质
  empty-search:
    material: PAPER
  empty-category:
    material: BARRIER
  action-bar:
    filler:
      material: GRAY_STAINED_GLASS_PANE
    prev:
      material: ARROW
    next:
      material: ARROW
    close:
      material: BARRIER
    stats:
      material: BOOK
    special:
      material: GRAY_STAINED_GLASS_PANE
    back:
      material: OAK_DOOR
  progress-bar:
    left: "["
    filled: "|"
    empty: "|"
    right: "]"
    length: 20
    left-color: "white"
    filled-color: "green"
    empty-color: "dark_gray"
    right-color: "white"
    percent-color: "aqua"
